<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaigns — Lumani Impact</title><link rel="stylesheet" href="assets/fonts/plus-jakarta-sans.css"><style>body{margin:0;background:#f7fbf8;color:#16382a;font:16px/1.6 'Plus Jakarta Sans',sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}header img{width:180px}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}article{background:#fff;border:1px solid #dde9e2;border-radius:16px;overflow:hidden}article img{width:100%;height:220px;object-fit:cover}article a{color:inherit;text-decoration:none}h2{font-size:18px;padding:0 20px}input{box-sizing:border-box;width:100%;padding:14px;margin:0 0 24px;border:1px solid #dde9e2;border-radius:10px;font:inherit}</style><main><header><img src="lumani-impact-logo.png" alt="Lumani Impact"></header><h1>Campaigns</h1><input id="search" type="search" placeholder="Search campaigns" aria-label="Search campaigns"><div id="list"></div></main><script src="offline-data_v%3Df7c3adaa0867.js"></script><script>function render(){const list=document.getElementById('list');list.replaceChildren();for(const c of OFFLINE_CAMPAIGNS.filter(c=>c.title.toLowerCase().includes(document.getElementById('search').value.toLowerCase()))){const article=document.createElement('article');const a=document.createElement('a');a.href='campaign-detail.html?slug='+encodeURIComponent(c.slug);const img=document.createElement('img');img.src=c.image_url;img.alt='';img.loading='lazy';const h=document.createElement('h2');h.textContent=c.title;a.append(img,h);article.append(a);list.append(article);}}document.getElementById('search').addEventListener('input',render);render();</script></html>
